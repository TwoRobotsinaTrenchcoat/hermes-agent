name: wine2e-95625-stall-watchdog
on:
  push:
    branches: ['wine2e-95625/**']
jobs:
  stall-watchdog-proof:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test deps
        run: pip install pytest pyyaml psutil
      - name: Watchdog + pipe-drain suites (head)
        run: python -m pytest tests/test_desktop_update_windows_pipe_drain.py tests/test_desktop_update_windows_python_handoff.py tests/test_desktop_update_windows_progress.py tests/test_desktop_update_windows_timestamp.py -q --tb=short
      - name: Self-test fixture — silent stalled child is terminated (exit 124, no survivors)
        shell: pwsh
        run: |
          $env:HERMES_UPDATE_STEP_IDLE_SECONDS = "5"
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/desktop-update/windows.ps1 -SelfTestPipeDrain
          if ($LASTEXITCODE -ne 0) { throw "self-test failed rc=$LASTEXITCODE" }
      - name: Default is 600s (Teknium adjustment pinned)
        shell: pwsh
        run: |
          $hit = Select-String -Path scripts/desktop-update/windows.ps1 -Pattern '^\$script:StepIdleTimeoutSeconds = 600'
          if (-not $hit) { throw "default idle timeout is not 600" }
          "default 600s confirmed"
